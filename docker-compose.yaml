services:
  dolphin-2fa:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dolphin-2fa
    restart: unless-stopped
    volumes:
      # 持久化 SQLite 数据库到宿主机 ./data 目录
      - ./data:/app/data
    networks:
      - internal_net
    # 不对外映射端口，防止绕过 Nginx 直连

  nginx:
    image: nginx:1.27-alpine
    container_name: dolphin-2fa-nginx
    restart: unless-stopped
    depends_on:
      - dolphin-2fa
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Nginx 配置文件
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/certs:ro
      # 自定义 404 页面
      - ./nginx/404.html:/etc/nginx/html/404.html:ro
    networks:
      - internal_net

networks:
  internal_net:
    driver: bridge