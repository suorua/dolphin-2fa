<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>豚宝宝 2FA 助手</title>
    <link rel="icon" type="image/svg+xml" href="images/dolphin-day.svg">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="js/tailwind-config.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=JetBrains+Mono:wght@600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="text-slate-700 dark:text-sky-100 min-h-screen flex flex-col antialiased selection:bg-sky-300 selection:text-sky-950 relative">

    <div id="bubbleField" aria-hidden="true" class="fixed inset-0 overflow-hidden pointer-events-none z-0"></div>

    <div class="w-full overflow-hidden leading-none pointer-events-none select-none opacity-80 dark:opacity-30">
        <img src="images/wave-light.svg" alt="" class="w-[110%] max-w-none -ml-[5%] h-8 sm:h-11 animate-wave block dark:hidden">
        <img src="images/wave-dark.svg" alt="" class="w-[110%] max-w-none -ml-[5%] h-8 sm:h-11 animate-wave hidden dark:block">
    </div>

    <header class="relative z-20 max-w-4xl w-full mx-auto px-4 sm:px-6 pt-2 pb-4">
        <div class="flex items-center justify-between gap-2 mb-4">
            <div class="flex items-center gap-2.5 bg-white/80 dark:bg-slate-900/75 backdrop-blur-md px-4 py-2 rounded-full border-2 border-sky-200/80 dark:border-sky-800/70 shadow-sm">
                <span class="font-bold text-base sm:text-lg bg-gradient-to-r from-sky-500 to-teal-400 bg-clip-text text-transparent">
                    豚宝宝 2FA 助手
                </span>
            </div>

            <div class="flex items-center gap-2">
                <button id="btnDemoKey" type="button" class="text-xs sm:text-sm font-semibold px-3.5 py-2 rounded-full bg-white/85 dark:bg-slate-900/80 text-sky-600 dark:text-sky-300 border-2 border-sky-200/80 dark:border-sky-800/70 hover:bg-sky-50 dark:hover:bg-slate-800 transition-all shadow-sm candy-press">
                    ✨ 试一试示例
                </button>
                <button id="themeToggle" type="button" aria-label="切换深海星夜模式" title="切换海洋白昼 / 深海星夜模式" class="p-2.5 rounded-full bg-white/85 dark:bg-slate-900/80 border-2 border-sky-200/80 dark:border-sky-800/70 hover:scale-105 transition-all shadow-sm candy-press">
                    <img src="images/icon-moon.svg" alt="深海星夜模式" class="w-5 h-5 block dark:hidden">
                    <img src="images/icon-sun.svg" alt="阳光海洋模式" class="w-5 h-5 hidden dark:block">
                </button>
            </div>
        </div>

        <div class="bg-white/90 dark:bg-slate-900/85 backdrop-blur-md rounded-3xl border-2 border-sky-200/80 dark:border-sky-800/70 p-4 sm:p-5 shadow-candy flex flex-col sm:flex-row items-center gap-4 relative">
            <div id="duduMascotWrapper" role="button" tabindex="0" title="点点豚宝宝有惊喜哦！" class="relative cursor-pointer select-none shrink-0 group focus:outline-none">
                <div id="duduSprite" class="w-24 h-24 sm:w-28 sm:h-28 animate-dudu-float transition-transform">
                    <img src="images/dolphin-day.svg" alt="豚宝宝吉祥物" class="w-full h-full drop-shadow-md block dark:hidden" draggable="false">
                    <img src="images/dolphin-night.svg" alt="戴睡帽的豚宝宝吉祥物" class="w-full h-full drop-shadow-md hidden dark:block" draggable="false">
                </div>
                <span class="absolute -bottom-1 left-1/2 -translate-x-1/2 whitespace-nowrap text-[10px] font-bold px-2 py-0.5 rounded-full bg-sky-100 dark:bg-indigo-950 text-sky-600 dark:text-indigo-300 border border-sky-200 dark:border-indigo-800 group-hover:scale-105 transition-transform">
                    戳戳豚宝宝 🫧
                </span>
            </div>

            <div class="flex-1 text-center sm:text-left">
                <div class="inline-block sm:block relative bg-sky-50/90 dark:bg-slate-800/90 rounded-2xl px-4 py-3 border border-sky-200/80 dark:border-sky-700/60">
                    <p id="duduSpeechText" class="text-sm sm:text-base font-medium text-slate-700 dark:text-sky-100 leading-relaxed">
                        嗨呀！我是 <strong class="text-sky-600 dark:text-sky-300">豚宝宝</strong>～如果倒计时变成珊瑚粉色，说明马上要刷新下一个验证码啦！⏳
                    </p>
                </div>
            </div>
        </div>
    </header>

    <main class="relative z-10 flex-1 max-w-4xl w-full mx-auto px-4 sm:px-6 pb-14 space-y-8">

        <section class="bg-white/95 dark:bg-slate-900/90 backdrop-blur-md rounded-3xl border-2 border-sky-200/80 dark:border-sky-800/70 shadow-candy overflow-hidden">
            <div class="p-6 sm:p-8 space-y-6">

                <div class="space-y-2">
                    <div class="flex items-center justify-between">
                        <label for="secretInput" class="flex items-center gap-1.5 text-sm sm:text-base font-bold text-slate-700 dark:text-sky-100">
                            <span>🔑 输入 2FA</span>
                        </label>
                        <button id="btnClearInput" type="button" class="text-xs font-semibold px-2.5 py-1 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-500 hover:text-coral-500 transition-colors hidden">
                            清空重填 ✕
                        </button>
                    </div>

                    <div class="relative">
                        <input
                            type="text"
                            id="secretInput"
                            autocomplete="off"
                            autocorrect="off"
                            autocapitalize="characters"
                            spellcheck="false"
                            placeholder="粘贴 Base32 (如 JBSWY3DPEHPK3PXP) 或二维码链接..."
                            class="w-full font-mono text-sm sm:text-base pl-4 pr-24 py-4 rounded-2xl bg-sky-50/70 dark:bg-slate-950/90 border-2 border-sky-200 dark:border-sky-800 focus:outline-none focus:ring-4 focus:ring-sky-400/20 focus:border-sky-400 transition-all placeholder:font-sans placeholder:text-slate-400 dark:placeholder:text-slate-600"
                        >
                        <button
                            id="btnPaste"
                            type="button"
                            class="absolute right-2.5 top-1/2 -translate-y-1/2 px-3.5 py-2 rounded-xl text-xs font-bold bg-sky-500 hover:bg-sky-400 text-white shadow-sm transition-all candy-press"
                        >
                            📋 粘贴
                        </button>
                    </div>

                    <div id="validationFeedback" class="min-h-[22px] text-xs flex items-center gap-1.5 px-1">
                        <span class="text-slate-400 dark:text-slate-400">豚宝宝会自动帮你过滤空格与大小写，符合国际 RFC 6238 标准哦~</span>
                    </div>
                </div>

                <div>
                    <button
                        id="btnToggleAdvanced"
                        type="button"
                        class="inline-flex items-center gap-1.5 text-xs font-semibold px-3 py-1.5 rounded-full bg-sky-50 dark:bg-slate-800 text-sky-600 dark:text-sky-300 hover:bg-sky-100 dark:hover:bg-slate-700 transition-colors"
                    >
                        <svg id="advancedChevron" class="w-3.5 h-3.5 transition-transform duration-200" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7"></path>
                        </svg>
                        <span>⚙️ 展开高级参数 (默认: 6位 / 30秒 / SHA-1)</span>
                    </button>

                    <div id="advancedPanel" class="hidden grid-cols-1 sm:grid-cols-3 gap-4 mt-3 p-4 rounded-2xl bg-sky-50/60 dark:bg-slate-950/70 border-2 border-sky-100 dark:border-sky-900/70">
                        <div>
                            <label for="paramDigits" class="block text-xs font-semibold text-slate-500 dark:text-sky-300 mb-1.5">验证码位数</label>
                            <select id="paramDigits" class="w-full text-sm font-medium rounded-xl bg-white dark:bg-slate-900 border-2 border-sky-200/80 dark:border-sky-800 px-3 py-2 focus:outline-none focus:border-sky-400">
                                <option value="6" selected>6 位数字 (标准)</option>
                                <option value="8">8 位数字</option>
                            </select>
                        </div>
                        <div>
                            <label for="paramPeriod" class="block text-xs font-semibold text-slate-500 dark:text-sky-300 mb-1.5">刷新周期 (秒)</label>
                            <input type="number" id="paramPeriod" value="30" min="5" max="300" class="w-full text-sm font-medium rounded-xl bg-white dark:bg-slate-900 border-2 border-sky-200/80 dark:border-sky-800 px-3 py-2 focus:outline-none focus:border-sky-400">
                        </div>
                        <div>
                            <label for="paramAlgorithm" class="block text-xs font-semibold text-slate-500 dark:text-sky-300 mb-1.5">加密哈希算法</label>
                            <select id="paramAlgorithm" class="w-full text-sm font-medium rounded-xl bg-white dark:bg-slate-900 border-2 border-sky-200/80 dark:border-sky-800 px-3 py-2 focus:outline-none focus:border-sky-400">
                                <option value="SHA-1" selected>SHA-1 (默认)</option>
                                <option value="SHA-256">SHA-256</option>
                                <option value="SHA-512">SHA-512</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="rounded-3xl bg-gradient-to-br from-sky-400 via-sky-500 to-teal-400 dark:from-sky-900 dark:via-indigo-950 dark:to-slate-900 text-white p-6 sm:p-8 relative overflow-hidden shadow-lg border-2 border-sky-300/60 dark:border-sky-700/60">
                    <div class="absolute -right-8 -bottom-10 w-44 h-44 rounded-full bg-white/10 pointer-events-none"></div>
                    <div class="absolute -left-10 -top-10 w-36 h-36 rounded-full bg-white/10 pointer-events-none"></div>

                    <div class="flex items-center justify-between text-xs sm:text-sm text-sky-50 mb-4 relative z-10">
                        <div class="flex items-center gap-2 truncate pr-4">
                            <span class="inline-flex items-center justify-center w-6 h-6 rounded-full bg-white/20 text-xs">🐚</span>
                            <span id="currentIssuerLabel" class="truncate font-bold tracking-wide">当前实时动态口令</span>
                        </div>
                        <span class="text-xs px-2.5 py-0.5 rounded-full bg-white/20 font-medium shrink-0">
                            点击数字直接复制
                        </span>
                    </div>

                    <div class="flex flex-col sm:flex-row items-center justify-between gap-5 relative z-10">
                        <div class="flex items-center gap-4 sm:gap-5 w-full sm:w-auto justify-center sm:justify-start">
                            <div class="relative w-16 h-16 sm:w-20 sm:h-20 shrink-0 flex items-center justify-center">
                                <svg class="w-full h-full -rotate-90 drop-shadow" viewBox="0 0 80 80">
                                    <circle cx="40" cy="40" r="33" fill="rgba(255,255,255,0.14)" stroke="rgba(255,255,255,0.28)" stroke-width="6"></circle>
                                    <circle
                                        id="ringProgressCircle"
                                        cx="40" cy="40" r="33"
                                        fill="none"
                                        stroke="#ffffff"
                                        stroke-width="6"
                                        stroke-linecap="round"
                                        stroke-dasharray="207.35"
                                        stroke-dashoffset="0"
                                        class="transition-all duration-150 ease-linear"
                                    ></circle>
                                </svg>
                                <div class="absolute inset-0 flex flex-col items-center justify-center leading-none">
                                    <span class="text-xs mb-0.5">💧</span>
                                    <span id="secondsRemaining" class="font-mono font-bold text-sm sm:text-base text-white">30s</span>
                                </div>
                            </div>

                            <div
                                id="otpDisplayWrapper"
                                title="点我复制验证码"
                                class="group cursor-pointer select-all py-2 px-4 rounded-2xl bg-white/15 hover:bg-white/25 border border-white/25 transition-all active:scale-95"
                            >
                                <span id="otpCodeDisplay" class="font-mono text-4xl sm:text-5xl md:text-6xl font-bold tracking-wider text-white drop-shadow-sm">
                                    --- ---
                                </span>
                            </div>
                        </div>

                        <button
                            id="btnCopyMain"
                            type="button"
                            disabled
                            class="w-full sm:w-auto flex items-center justify-center gap-2 px-6 py-3.5 rounded-2xl font-bold text-sm sm:text-base bg-white text-sky-600 hover:bg-sky-50 disabled:bg-white/30 disabled:text-white/60 disabled:cursor-not-allowed shadow-md transition-all candy-press shrink-0"
                        >
                            <span id="copyBtnEmoji">🫧</span>
                            <span id="copyBtnText">复制验证码</span>
                        </button>
                    </div>
                </div>

            </div>
        </section>

    </main>

    <div id="toastContainer" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2.5 pointer-events-none max-w-[90vw]"></div>

    <script src="js/totp.js"></script>
    <script src="js/mascot.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
