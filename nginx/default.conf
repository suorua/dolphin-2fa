# 1. 拦截所有非域名访问（含直接 IP 访问 HTTP 80），统一返回 404
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    server_tokens off;
    root /etc/nginx/html;

    location / {
        return 404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}

# 2. 拦截所有非域名访问（含直接 IP 访问 HTTPS 443），统一返回 404
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name _;

    # 复用证书保证 TLS 握手可完成，从而返回 404 页面
    ssl_certificate     /etc/nginx/certs/fullchain.cer;
    ssl_certificate_key /etc/nginx/certs/private.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    server_tokens off;
    root /etc/nginx/html;

    location / {
        return 404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}

# 3. 仅允许域名 2fa.example.com 走 HTTP -> HTTPS 跳转
server {
    listen 80;
    listen [::]:80;
    server_name 2fa.example.com;

    return 301 https://$host$request_uri;
}

# 4. 域名 2fa.example.com HTTPS 反向代理
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name 2fa.example.com;

    # 容器内证书路径（对应 docker-compose.yml 中的 ./certs 挂载）
    ssl_certificate     /etc/nginx/certs/fullchain.cer;
    ssl_certificate_key /etc/nginx/certs/private.key;

    # TLS 安全配置
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # 隐藏 Nginx 版本号
    server_tokens off;

    # 开启 HSTS（强制浏览器后续仅用 HTTPS 访问）
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass http://dolphin-2fa:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 30s;
        proxy_connect_timeout 10s;
    }
}