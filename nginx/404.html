<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 · 页面不存在</title>
    <style>
        :root {
            --bg: linear-gradient(180deg, #e0f7fa 0%, #f0f9ff 45%, #e6fffa 100%);
            --card-bg: rgba(255, 255, 255, 0.92);
            --card-border: rgba(186, 230, 253, 0.9);
            --title-grad: linear-gradient(90deg, #0ea5e9, #2dd4bf);
            --text-main: #334155;
            --text-sub: #64748b;
            --badge-bg: #e0f2fe;
            --badge-text: #0284c7;
            --shadow: 0 10px 25px -5px rgba(56, 189, 248, 0.18), 0 8px 10px -6px rgba(56, 189, 248, 0.1);
            --dolphin-night: none;
            --dolphin-day: block;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: radial-gradient(circle at 50% 0%, #132f57 0%, #091930 55%, #050d1a 100%);
                --card-bg: rgba(15, 23, 42, 0.88);
                --card-border: rgba(7, 89, 133, 0.75);
                --title-grad: linear-gradient(90deg, #38bdf8, #5eead4);
                --text-main: #e0f2fe;
                --text-sub: rgba(125, 211, 252, 0.75);
                --badge-bg: #082f49;
                --badge-text: #7dd3fc;
                --shadow: 0 10px 25px -5px rgba(2, 132, 199, 0.2), 0 8px 10px -6px rgba(2, 132, 199, 0.12);
                --dolphin-day: none;
                --dolphin-night: block;
            }
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            font-family: "Noto Sans SC", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: var(--bg);
            color: var(--text-main);
        }

        .card {
            width: 100%;
            max-width: 420px;
            background: var(--card-bg);
            border: 2px solid var(--card-border);
            border-radius: 28px;
            padding: 32px 28px 36px;
            text-align: center;
            box-shadow: var(--shadow);
            backdrop-filter: blur(10px);
        }

        .mascot-box {
            width: 96px;
            height: 96px;
            margin: 0 auto 14px;
            animation: duduFloat 3.2s ease-in-out infinite;
        }

        .mascot-box svg {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 6px 10px rgba(14, 165, 233, 0.16));
        }

        .dolphin-day {
            display: var(--dolphin-day);
        }

        .dolphin-night {
            display: var(--dolphin-night);
        }

        @keyframes duduFloat {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-6px) rotate(2deg); }
        }

        .code-badge {
            display: inline-block;
            padding: 4px 14px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.06em;
            background: var(--badge-bg);
            color: var(--badge-text);
            margin-bottom: 12px;
        }

        h1 {
            font-size: 44px;
            line-height: 1.1;
            font-weight: 800;
            background: var(--title-grad);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 12px;
        }

        p {
            font-size: 14px;
            line-height: 1.65;
            color: var(--text-sub);
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="mascot-box" aria-hidden="true">
            <!-- 白天豚宝宝 -->
            <svg class="dolphin-day" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="24" cy="34" r="6" fill="#BAE6FD"/>
                <circle cx="96" cy="28" r="5" fill="#6EE7B7"/>
                <path d="M56 26C52 16 44 14 40 17" stroke="#38BDF8" stroke-width="3.5" stroke-linecap="round"/>
                <path d="M62 26C65 16 73 15 77 18" stroke="#38BDF8" stroke-width="3.5" stroke-linecap="round"/>
                <path d="M52 28C52 22 68 22 68 28L71 36H49L52 28Z" fill="#0284C7"/>
                <path d="M26 78C26 48 48 34 72 34C92 34 104 49 105 64C109 65 112 68 112 72C112 77 107 80 100 81C90 92 70 96 48 92C35 90 26 85 26 78Z" fill="#38BDF8"/>
                <path d="M35 81C50 87 76 86 95 77C84 89 62 93 42 88C38 87 36 84 35 81Z" fill="#F0F9FF"/>
                <path d="M58 72L75 81L62 90C57 85 56 78 58 72Z" fill="#0EA5E9"/>
                <path d="M27 77C17 73 13 65 17 59C21 54 28 57 31 66C34 59 42 58 45 64C48 70 41 79 27 77Z" fill="#0284C7"/>
                <circle cx="84" cy="58" r="6.5" fill="#0F172A"/>
                <circle cx="82" cy="55.8" r="2.3" fill="#FFFFFF"/>
                <circle cx="86.2" cy="60.2" r="1.2" fill="#FFFFFF"/>
                <ellipse cx="75" cy="67" rx="5.5" ry="3.4" fill="#FDA4AF" fill-opacity="0.8"/>
                <path d="M88 68C91 71 96 71 99 68" stroke="#0F172A" stroke-width="2.8" stroke-linecap="round"/>
                <path d="M101 44L103 49L108 51L103 53L101 58L99 53L94 51L99 49L101 44Z" fill="#FDE047"/>
            </svg>

            <!-- 夜晚戴睡帽豚宝宝 -->
            <svg class="dolphin-night" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="24" cy="34" r="6" fill="#7DD3FC" fill-opacity="0.5"/>
                <circle cx="96" cy="28" r="5" fill="#6EE7B7" fill-opacity="0.6"/>
                <path d="M56 26C52 16 44 14 40 17" stroke="#7DD3FC" stroke-width="3.5" stroke-linecap="round"/>
                <path d="M62 26C65 16 73 15 77 18" stroke="#7DD3FC" stroke-width="3.5" stroke-linecap="round"/>
                <path d="M52 28C52 22 68 22 68 28L71 36H49L52 28Z" fill="#0369A1"/>
                <path d="M26 78C26 48 48 34 72 34C92 34 104 49 105 64C109 65 112 68 112 72C112 77 107 80 100 81C90 92 70 96 48 92C35 90 26 85 26 78Z" fill="#38BDF8"/>
                <path d="M35 81C50 87 76 86 95 77C84 89 62 93 42 88C38 87 36 84 35 81Z" fill="#E0F2FE"/>
                <path d="M58 72L75 81L62 90C57 85 56 78 58 72Z" fill="#0EA5E9"/>
                <path d="M27 77C17 73 13 65 17 59C21 54 28 57 31 66C34 59 42 58 45 64C48 70 41 79 27 77Z" fill="#0369A1"/>
                <path d="M63 35C66 20 82 15 92 22C88 28 84 33 82 37L63 35Z" fill="#818CF8"/>
                <ellipse cx="73" cy="36" rx="14" ry="4" transform="rotate(-8 73 36)" fill="#E0E7FF"/>
                <circle cx="93" cy="22" r="4.5" fill="#FDE047"/>
                <circle cx="84" cy="58" r="6.5" fill="#0F172A"/>
                <circle cx="82" cy="55.8" r="2.3" fill="#FFFFFF"/>
                <circle cx="86.2" cy="60.2" r="1.2" fill="#FFFFFF"/>
                <ellipse cx="75" cy="67" rx="5.5" ry="3.4" fill="#FDA4AF" fill-opacity="0.85"/>
                <path d="M88 68C91 71 96 71 99 68" stroke="#0F172A" stroke-width="2.8" stroke-linecap="round"/>
                <path d="M101 44L103 49L108 51L103 53L101 58L99 53L94 51L99 49L101 44Z" fill="#FDE047"/>
            </svg>
        </div>
        <div class="code-badge">404 NOT FOUND</div>
        <h1>404</h1>
        <p>这里什么都没有哦！</p>
    </div>
</body>
</html>
